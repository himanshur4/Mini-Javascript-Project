<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="heading">
            <h1>Age Calculator</h1>

        </div>
        <div class="date-picker">
            <div class="dob-container">
                <h2>Enter Your Date of Birth:</h2>
                <form>
                    <input type="date" id="dob">
                    <button type="calculate" class="calculate" onclick="ageCalculate()">Calculate</button>
                </form>
            </div>

        </div>
        <div id="result">
            <h2>Your age is:<br> <span id="years">0 </span>years, <span id="month">0 </span>months, <span id="days">0
                </span>days</h2>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
